[global]
type=global
user_agent=go-sip-integration
endpoint_identifier_order=username,auth_username,ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001]
type=endpoint
context=go-sip-integration
disallow=all
allow=ulaw
auth=auth-1001
aors=1001
direct_media=no

[auth-1001]
type=auth
auth_type=userpass
username=1001
password=secret

[1001]
type=aor
max_contacts=1
remove_existing=yes

[anonymous]
type=endpoint
context=go-sip-integration
disallow=all
allow=ulaw
aors=anonymous
direct_media=no

[anonymous]
type=aor
max_contacts=1
