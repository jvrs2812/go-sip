name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          bash scripts/validate-release.sh "$RELEASE_TAG"

          resolved_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$resolved_commit" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  integration:
    needs: resolve
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  publish:
    needs:
      - resolve
      - validate
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm immutable tag association
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RESOLVED_COMMIT: ${{ needs.resolve.outputs.commit }}
        shell: bash
        run: |
          current_commit="$(git rev-list -n 1 "$RELEASE_TAG")"

          if [[ "$current_commit" != "$RESOLVED_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG moved from $RESOLVED_COMMIT to $current_commit." >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$RESOLVED_COMMIT" ]]; then
            echo "Checkout does not match resolved tag commit." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          release_flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")

          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            newest_stable="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -Ev '-' | head -n 1)"

            if [[ "$RELEASE_TAG" == "$newest_stable" ]]; then
              release_flags+=(--latest)
            else
              release_flags+=(--latest=false)
            fi
          fi

          gh release create "$RELEASE_TAG" "${release_flags[@]}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false

      - name: Verify module publication
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/jvrs2812/go-sip@$RELEASE_TAG"; then
              exit 0
            fi

            echo "Module proxy has not indexed $RELEASE_TAG yet (attempt $attempt/6)."
            sleep 10
          done

          exit 1

      - name: Smoke test from an external module
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          consumer_directory="$(mktemp -d)"
          cd "$consumer_directory"

          go mod init example.test/go-sip-release-smoke
          GOPROXY=https://proxy.golang.org go get "github.com/jvrs2812/go-sip@$RELEASE_TAG"

          cat > main.go <<'EOF'
          package main

          import (
              "fmt"

              "github.com/jvrs2812/go-sip/sip"
          )

          func main() {
              message := sip.NewRequest("OPTIONS", "sip:service@example.test")
              fmt.Println(message.Method)
          }
          EOF

          go run . | grep -Fx OPTIONS
