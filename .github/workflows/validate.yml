name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to validate
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to validate
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: validate-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  format-and-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up minimum Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22.2"
          cache-dependency-path: |
            go.sum
            example/player/go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"

          if [[ -n "$unformatted" ]]; then
            printf 'Files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module files
        shell: bash
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

          cd example/player
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run vet
        run: go vet ./...

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Test release tag validation
        run: bash scripts/test-release-validation.sh

      - name: Build as an external module consumer
        run: bash scripts/test-external-module.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.22.2"
          - os: ubuntu-latest
            go: stable
          - os: windows-latest
            go: stable
          - os: macos-latest
            go: stable

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

  race-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Run race detector and coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Run reproducible microbenchmarks
        run: go test -run='^$' -bench=. -benchmem ./auth ./sip ./sdp ./media | tee benchmarks.txt

      - name: Upload validation reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-reports
          path: |
            coverage.out
            benchmarks.txt
          if-no-files-found: error
          retention-days: 14

  audio-player:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: example/player/go.sum

      - name: Install ALSA development files
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Build player example
        working-directory: example/player
        run: go build ./...

  optional-codecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Install optional codec development files
        run: sudo apt-get update && sudo apt-get install --yes libgsm1-dev libogg-dev libopus-dev libopusfile-dev pkg-config

      - name: Test GSM-FR, Opus, and SILK backends
        run: go test -race -count=1 -tags "gsm opus silk" ./media ./client

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Fuzz the SIP parser
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=20s ./sip
